<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Trade - La plateforme de trading Roblox</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Aura Trade — La plateforme de trading nouvelle génération pour l'écosystème Roblox. Échangez vos items School Fr RP, Adopt Me, MM2 et plus encore.">
    <meta name="keywords" content="Roblox, Trading, Items, Aura Trade, School Fr RP, Adopt Me, MM2">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Auth & Database -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="auth.js"></script>
</head>
<body>
    <!-- HEADER -->

    <header class="header">
        <div class="container header-inner">
            <a class="logo" onclick="navigate('home')" id="nav-logo">
                <svg viewBox="0 0 34 34" fill="none">
                    <rect width="34" height="34" rx="10" fill="url(#logoGrad)"/>
                    <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="34" y2="34"><stop stop-color="#FF6B2B"/><stop offset="1" stop-color="#FF9A5C"/></linearGradient></defs>
                    <path d="M17 8L22 13L20 19H14L12 13L17 8Z" fill="white" opacity="0.9"/>
                    <circle cx="17" cy="22" r="3" fill="white" opacity="0.9"/>
                </svg>
                <span class="logo-text">Aura Trade</span>
            </a>
            <div class="header-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" placeholder="Rechercher un item, un jeu..." id="headerSearchInput">
            </div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-primary" onclick="navigate('create')" id="btn-publish">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Publier
                </button>
                <div id="userActions" style="display: flex; align-items: center; gap: 8px;">
                    <button class="icon-btn" onclick="navigate('messages')" title="Messages" id="btn-messages">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        <span class="badge-dot" id="msgBadge" style="display:none;"></span>
                    </button>
                    <div class="avatar-sm" onclick="navigate('profile')" id="headerAvatar">?</div>
                </div>
                <button id="loginBtn" class="btn btn-secondary" onclick="window.location.href='login.html'" style="display: none;">Connexion</button>
            </div>

        </div>
    </header>

    <!-- MAIN -->
    <main class="main" id="appContent"></main>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
